worker_processes 1;

events {
    worker_connections 16;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log upstream_log;

    proxy_cache_path /var/cache/nginx/my_cache levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml text/csv;
    gzip_disable "msie6";
    gzip_proxied any;

    map $request_method $backend_upstream {
    default    techshop_cluster;
    POST       techshop_rw;
    PUT        techshop_rw;
    DELETE     techshop_rw;
    PATCH      techshop_rw;
    }

    upstream techshop_cluster {
        server app_rw:8080 weight=2;
        server app_ro_1:8080 weight=1;
        server app_ro_2:8080 weight=1;
    }

    upstream techshop_rw {
        server app_rw:8080;
    }

    server {
        listen 80;
        server_name techshop.local;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name techshop.local;

        ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /status {
            stub_status;
            access_log off;
            allow all;
        }

        location /admin/ {
            proxy_set_header X-Script-Name /admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://techshop_pgadmin/;
            proxy_redirect off;
        }

        location = /admin {
            return 301 https://$host/admin/;
        }

        location = /api/v1 {
            return 302 /swagger/index.html;
        }

        location /swagger/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            location ~* \.(css|js)$ {
                proxy_cache my_cache;
                proxy_cache_valid 200 302 7d;
                proxy_cache_valid 404 1m;
                add_header X-Cache-Status $upstream_cache_status always;
                proxy_pass http://techshop_cluster;
            }
            
            proxy_pass http://techshop_cluster;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /api/v1/$1 break;

            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ @fallback;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        location @fallback {
            proxy_cache my_cache;
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 30s;
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass http://techshop_cluster;
        }
    }
}