name: CI

on:
  push:
    branches: [master]
    paths:
      - 'Backend - OAuth, Data-sharding/**'
  pull_request:
    branches: [master]
    paths:
      - 'Backend - OAuth, Data-sharding/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: Vet
        run: cd "Backend - OAuth, Data-sharding" && go vet ./app/... ./auth/... ./images/...

      - name: Test app
        run: cd "Backend - OAuth, Data-sharding/app" && go test ./... -cover

      - name: Test auth
        run: cd "Backend - OAuth, Data-sharding/auth" && go test ./... -cover

      - name: Test images
        run: cd "Backend - OAuth, Data-sharding/images" && go test ./... -cover

  build:
    name: Build docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build app
        run: cd "Backend - OAuth, Data-sharding" && docker build -f app/Dockerfile -t techshop-app .
      - name: Build auth
        run: cd "Backend - OAuth, Data-sharding" && docker build -f auth/Dockerfile -t auth-service .
      - name: Build images
        run: cd "Backend - OAuth, Data-sharding" && docker build -f images/Dockerfile -t images-service .
