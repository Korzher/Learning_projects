services:
  postgres:
    image: postgres:16-alpine
    container_name: techshop_db
    environment:
      POSTGRES_DB: techshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    image: migrate/migrate:4
    container_name: techshop-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: [
      "migrate",
      "-path", "/migrations",
      "-database", "postgres://postgres:postgres@postgres:5432/techshop?sslmode=disable",
      "up"
    ]
    restart: "on-failure"


  app_rw:
    build: .
    container_name: techshop_app_rw
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  app_ro_1:
    build: .
    container_name: techshop_app_ro_1
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  app_ro_2:
    build: .
    container_name: techshop_app_ro_2
    ports:
      - "8083:8080"
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  nginx:
    image: nginx:alpine
    container_name: techshop_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app_rw:
        condition: service_started
      app_ro_1:
        condition: service_started
      app_ro_2:
        condition: service_started
    restart: on-failure

  pgadmin:
    image: dpage/pgadmin4
    container_name: techshop_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techshop.ru
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_ALLOWED_HOSTS: "['techshop_pgadmin', 'localhost', '127.0.0.1', 'techshop.local']"
    ports: 
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: on-failure


volumes:
  postgres_data:
  pgadmin_data: