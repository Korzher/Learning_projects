syntax = "proto3";
package images;

option go_package = "./gen;gen";

service ImageService {
    rpc AddImage(AddImageRequest) returns (AddImageResponse);
    rpc GetImageByImageID(GetImageByImageIDRequest) returns (GetImageResponse);
    rpc ChangeImage(ChangeImageRequest) returns (ChangeImageResponse);
    rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);
}

message AddImageRequest {
    bytes image = 1;
}

message AddImageResponse {
    string image_id = 1;
}

message GetImageByImageIDRequest {
    string image_id = 1;
}

message GetImageResponse {
    bytes image = 1;
}


message ChangeImageRequest {
    string image_id = 1;
    bytes image = 2;
}

message ChangeImageResponse {
    bool success = 1;
    string message = 2;
}

message DeleteImageRequest {
    string image_id = 1;
}

message DeleteImageResponse {
    bool success = 1;
    string message = 2;
}
